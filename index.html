    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#124F38" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1311" media="(prefers-color-scheme: dark)" />

    <title>Mubarak Mohammed Ali</title>
    <meta
      name="description"
      content="Mubarak Mohammed Ali | Web Developer and Level 400 Information Technology Education Student."
    />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('leo-portfolio-theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>

    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Mubarak Mohammed Ali" />
    <meta
      property="og:description"
      content="Web Developer and Level 400 Information Technology Education Student, building practical digital solutions."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500;600&display=swap"

    />

      rel="stylesheet"
