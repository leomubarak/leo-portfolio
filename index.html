<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#124F38" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1311" media="(prefers-color-scheme: dark)" />

    <title>Leo | Information Technology Education Student &amp; Developer</title>
    <meta
      name="description"
      content="Personal portfolio of Leo, an Information Technology Education student and developer passionate about software development, educational technology, programming, and building practical digital solutions."
    />

    <!-- Static fallback cards for crawlers that do not run JavaScript.
         Per-page values are set at runtime by src/components/Seo.tsx. -->
    <meta property="og:type" content="profile" />
    <meta
      property="og:title"
      content="Leo | Information Technology Education Student &amp; Developer"
    />
    <meta
      property="og:description"
      content="Student developer and educator building practical digital solutions in Kumasi, Ghana."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Applies the saved theme before React paints, so there is no white flash
      on a dark-mode reload. Keep this inline and keep it first.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('leo-portfolio-theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* localStorage blocked (private mode) — fall back to light. */
        }
      })();
    </script>

    <!-- Fonts. Split into two requests so a miss on one family cannot break the other. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>
      <div
        style="
          max-width: 34rem;
          margin: 4rem auto;
          padding: 0 1.5rem;
          font-family: system-ui, sans-serif;
          line-height: 1.6;
        "
      >
        <h1 style="font-size: 1.5rem">
          Leo — Information Technology Education student and developer
        </h1>
        <p>
          This portfolio needs JavaScript to display. Please enable it, or get in touch through the
          social profiles linked from the site.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
